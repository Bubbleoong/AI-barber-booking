name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check-and-test:
    name: Code Quality, Unit Tests & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Check code formatting
        run: npm run format:check

      - name: Run linter
        run: npm run lint

      - name: Check TypeScript types
        run: npm run typecheck

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Run unit tests
        run: npm run test:unit

      - name: Verify build
        run: npm run build
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/barber_prod?schema=public"
          AUTH_SECRET: "12345678901234567890123456789012"
          APP_URL: "http://localhost:3000"
          AUTH_LINE_ID: "dummy_line_id"
          AUTH_LINE_SECRET: "dummy_line_secret"
